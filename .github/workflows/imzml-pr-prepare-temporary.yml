# 作業専用ブランチでPRの固定commitを検証する。PR差分にこのworkflowは含めない。
name: imzml-pr-prepare-temporary
on:
  push:
    branches: [claude/imzml-autoimport-ver70-0]
permissions:
  contents: read
concurrency:
  group: imzml-pr-prepare-ver70-0
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.event.head_commit.message, '[apply-imzml-autoimport]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c7bbc7a703e62bbf2218477b4975d0bf82b66484
          persist-credentials: false
      - name: 検証対象commitの確認
        run: test "$(git rev-parse HEAD)" = c7bbc7a703e62bbf2218477b4975d0bf82b66484
      - name: アプリ既定依存とpytestを導入
        id: dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet -r App/requirements.txt pytest
      - name: 関連109ケース（合成MS1 fixtureによる実imzML・Parquet入出力を含む）
        env:
          PYTHONPATH: App
        run: |
          python3 -m pytest -q \
            App/tests/test_imzml_autoimport_core.py \
            App/tests/test_imzml_autoimport_validation.py \
            App/tests/test_imzml_autoimport_pipeline.py \
            App/tests/test_imzml_autoimport_real_io.py \
            App/tests/test_section_metadata_workflow.py \
            App/tests/test_section_execution_policy.py \
            App/tests/test_version_consistency.py
      - name: 既存imzML・データ管理・SCiLSの関連回帰
        if: always() && steps.dependencies.outcome == 'success'
        env:
          PYTHONPATH: App
        run: python3 -m pytest -q App/tests/test_imzml_io.py App/tests/test_data_manager.py App/tests/test_scils_converter.py
      - name: 依存版を記録
        if: always() && steps.dependencies.outcome == 'success'
        run: python3 -m pip freeze
