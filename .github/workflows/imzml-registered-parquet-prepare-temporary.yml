name: imzml-registered-parquet-prepare-temporary

on:
  push:
    branches:
      - claude/imzml-registered-parquet-bootstrap-ver74-0

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Bundleを検証しmainから実装ブランチを作成
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ver74
          {
            cat .pr-bootstrap-ver74/bundle/part_00
            cat .pr-bootstrap-ver74/correct/part_01_*
            cat .pr-bootstrap-ver74/bundle/part_02
            cat .pr-bootstrap-ver74/bundle/part_03
            cat .pr-bootstrap-ver74/bundle/part_04
            cat .pr-bootstrap-ver74/bundle/part_05
            cat .pr-bootstrap-ver74/bundle/part_06
            cat .pr-bootstrap-ver74/bundle/part_07
            cat .pr-bootstrap-ver74/correct/part_08_*
          } | base64 -d > /tmp/ver74.tar.xz
          echo "6c25e1f57b2f4c7e6b8b70eebdac0f46c623114ca4bb785696afd702884671d9  /tmp/ver74.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ver74.tar.xz -C /tmp/ver74
          python3 -m py_compile /tmp/ver74/apply_ver74.py /tmp/ver74/files/*.py
          git checkout -B claude/imzml-registered-parquet-ver74-0 origin/main
          mkdir -p .pr-bootstrap-ver74/files
          cp /tmp/ver74/apply_ver74.py .pr-bootstrap-ver74/apply_ver74.py
          cp /tmp/ver74/files/*.py .pr-bootstrap-ver74/files/
          python3 .pr-bootstrap-ver74/apply_ver74.py
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              "App/app/services/imzml_validation.py",
              "App/app/services/input_preparation.py",
              "App/app/services/section_metadata.py",
              "App/app/services/data_manager.py",
              "App/app/services/imzml_io.py",
              "App/app/services/imzml_processed.py",
              "App/Script/helpers/analysis_contract.R",
              "App/docs/IMZML_AUTOIMPORT.md",
              "App/app/templates/help/imzml_autoimport.html",
              "CHANGELOG.md",
          ]:
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          rm -rf .pr-bootstrap-ver74

      - name: Python依存とpytestを導入
        run: python3 -m pip install --disable-pip-version-check --quiet -r App/requirements.txt pytest

      - name: 構文・テンプレート・差分検査
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q App/app App/tests
          python3 -c "from pathlib import Path; from jinja2 import Environment; [Environment().parse(p.read_text(encoding='utf-8')) for p in Path('App/app/templates').rglob('*.html')]"
          if command -v Rscript >/dev/null 2>&1; then
            Rscript -e "parse(file='App/Script/helpers/analysis_contract.R')"
          fi
          git diff --check

      - name: 最初の回帰失敗を特定
        env:
          PYTHONPATH: App
          FLASK_SECRET_KEY: test-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          MASTER_PASSWORD: runtime-test-password
          INITIAL_PASSWORD_B: runtime-share
        run: python3 -m pytest -x -vv App/tests
