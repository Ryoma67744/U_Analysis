name: imzml-inferred-ms1-prepare-temporary
on:
  push:
    branches: [claude/imzml-inferred-ms1-bootstrap-ver72-0]
permissions:
  contents: write
concurrency:
  group: imzml-inferred-ms1-ver72-0
  cancel-in-progress: false
jobs:
  prepare:
    if: startsWith(github.event.head_commit.message, '[apply-imzml-inferred-ms1]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: mainから最終ブランチを作り修正を適用
        run: |
          set -euo pipefail
          cat .pr-bootstrap-ver72/parts/part_* > /tmp/apply_ver72.py
          python3 -m py_compile /tmp/apply_ver72.py
          git checkout -B claude/imzml-inferred-ms1-preflight-ver72-0 origin/main
          python3 /tmp/apply_ver72.py
      - name: Python依存とpytestを導入
        run: python3 -m pip install --disable-pip-version-check --quiet -r App/requirements.txt pytest
      - name: 構文・テンプレート・差分検査
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          from jinja2 import Environment
          names = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          for name in names:
              path = Path(name)
              if name.endswith('.py'):
                  ast.parse(path.read_text(encoding='utf-8'), filename=name)
              elif name.endswith('.html'):
                  Environment().parse(path.read_text(encoding='utf-8'))
          print(f'validated changed files: {len(names)}')
          PY
          git diff --check
      - name: imzML契約・終了表示・既存回帰テスト
        env:
          PYTHONPATH: App
          FLASK_SECRET_KEY: test-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          MASTER_PASSWORD: runtime-test-password
          INITIAL_PASSWORD_B: runtime-share
        run: |
          python3 -m pytest -q \
            App/tests/test_imzml_ms_inference.py \
            App/tests/test_job_watcher_input_exit.py \
            App/tests/test_imzml_spatial_layout.py \
            App/tests/test_imzml_spatial_manifest.py \
            App/tests/test_imzml_spatial_static_contract.py \
            App/tests/test_imzml_io.py \
            App/tests/test_imzml_autoimport_core.py \
            App/tests/test_imzml_autoimport_validation.py \
            App/tests/test_imzml_autoimport_pipeline.py \
            App/tests/test_imzml_autoimport_real_io.py \
            App/tests/test_section_metadata_workflow.py \
            App/tests/test_section_execution_policy.py \
            App/tests/test_section_analysis_contract.py \
            App/tests/test_section_group_metadata.py \
            App/tests/test_section_group_buttons.py \
            App/tests/test_settings_runtime_callbacks.py \
            App/tests/test_export_options.py \
            App/tests/test_data_manager.py \
            App/tests/test_scils_converter.py \
            App/tests/test_data_export.py \
            App/tests/test_export_column_selection.py \
            App/tests/test_pptx_per_method_names.py \
            App/tests/test_version_consistency.py
      - name: 検証済み実装をPR用ブランチへ登録
        run: |
          set -euo pipefail
          test "$(grep -oP 'APP_VERSION = "\K[^"]+' App/app/version.py)" = '72.0'
          git config user.name 'Ryoma67744'
          git config user.email '76196606+Ryoma67744@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'SCiLS型imzMLの推定MS1判定と個別m/z軸診断を追加 [ver72.0]'
          git push origin HEAD:refs/heads/claude/imzml-inferred-ms1-preflight-ver72-0
