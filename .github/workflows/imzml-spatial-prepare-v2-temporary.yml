name: imzml-spatial-prepare-v2-temporary
on:
  push:
    branches: [claude/imzml-spatial-sections-bootstrap-v2]
permissions:
  contents: write
concurrency:
  group: imzml-spatial-v71-prepare-v2
  cancel-in-progress: false
jobs:
  prepare:
    if: startsWith(github.event.head_commit.message, '[apply-imzml-spatial-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: 最終39ファイル差分をmainへ適用してblob照合
        run: python3 .pr-bootstrap-spatial-v2/apply_patch.py
      - name: Python依存とpytestを導入
        run: python3 -m pip install --disable-pip-version-check --quiet -r App/requirements.txt pytest
      - name: 変更ファイルの構文・テンプレート・JavaScript検査
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          from jinja2 import Environment
          names=[]
          for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines():
              names.append(line[3:].split(' -> ',1)[-1])
          for name in names:
              p=Path(name)
              if name.endswith('.py'):
                  ast.parse(p.read_text(encoding='utf-8'), filename=name)
              elif name.endswith('.html'):
                  Environment().parse(p.read_text(encoding='utf-8'))
          print(f'validated changed files: {len(names)}')
          PY
          node --check App/app/assets/imzml_spatial_float.js
          git diff --check
      - name: 座標切片・変換・section・画面callback・出力回帰テスト
        env:
          PYTHONPATH: App
          FLASK_SECRET_KEY: test-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          MASTER_PASSWORD: runtime-test-password
          INITIAL_PASSWORD_B: runtime-share
        run: |
          python3 -m pytest -q \
            App/tests/test_imzml_spatial_layout.py \
            App/tests/test_imzml_spatial_manifest.py \
            App/tests/test_imzml_spatial_static_contract.py \
            App/tests/test_imzml_io.py \
            App/tests/test_imzml_autoimport_core.py \
            App/tests/test_imzml_autoimport_validation.py \
            App/tests/test_imzml_autoimport_pipeline.py \
            App/tests/test_imzml_autoimport_real_io.py \
            App/tests/test_section_metadata_workflow.py \
            App/tests/test_section_execution_policy.py \
            App/tests/test_section_analysis_contract.py \
            App/tests/test_section_group_metadata.py \
            App/tests/test_section_group_buttons.py \
            App/tests/test_settings_runtime_callbacks.py \
            App/tests/test_export_options.py \
            App/tests/test_data_manager.py \
            App/tests/test_scils_converter.py \
            App/tests/test_data_export.py \
            App/tests/test_export_column_selection.py \
            App/tests/test_pptx_per_method_names.py \
            App/tests/test_version_consistency.py
      - name: 変更Rファイルの構文検査
        run: |
          if command -v Rscript >/dev/null 2>&1; then
            Rscript -e 'files <- c("App/Script/DESI/260623_DESI-UMAP_Template_v16.R","App/Script/DESI/DESI_RDS_ClusterFilter_ver3.R","App/Script/TIMS/260623_DBSCAN_With_cluster_ver6_no-png_slim.R","App/Script/TIMS/260623_DBSCAN_ver18_Cluster_Filter_ReUMAP.R","App/Script/helpers/analysis_contract.R","App/Script/helpers/extract_seurat_data.R","App/Script/helpers/test_parquet_ingest_equiv.R"); for (f in files) parse(file=f); cat("R parse OK\n")'
          else
            echo 'Rscript is unavailable; R parse is not claimed.'
          fi
      - name: 検証済み実装をPR用ブランチへ登録
        run: |
          set -euo pipefail
          test "$(grep -oP 'APP_VERSION = "\K[^"]+' App/app/version.py)" = '71.0'
          test "$(git status --porcelain | wc -l | tr -d ' ')" = '39'
          git config user.name 'Ryoma67744'
          git config user.email '76196606+Ryoma67744@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '39'
          git diff --cached --check
          git commit -m 'imzML座標から物理切片を認識しモデルレスfloat表示に対応 [ver71.0]'
          git push origin HEAD:refs/heads/claude/imzml-spatial-sections-ver71-0
