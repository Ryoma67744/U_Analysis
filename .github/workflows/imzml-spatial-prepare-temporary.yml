# PR作成時の転送・検証専用。最終PRブランチには含めない。
name: imzml-spatial-prepare-temporary
on:
  push:
    branches: [claude/imzml-spatial-sections-bootstrap]
permissions:
  contents: write
concurrency:
  group: imzml-spatial-prepare-ver71-0
  cancel-in-progress: false
jobs:
  prepare:
    if: startsWith(github.event.head_commit.message, '[apply-imzml-spatial]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: 固定差分をmainへ適用して検査
        shell: bash
        run: |
          set -euo pipefail
          cat .pr-bootstrap-spatial/part*.txt | base64 -d | gzip -d > /tmp/imzml-spatial.patch
          echo '664ddd9428400f119753f96ee8ee36e08750f4b16fca0c5cfe89c31b179c1a72  /tmp/imzml-spatial.patch' | sha256sum -c -
          git fetch origin main
          test "$(git rev-parse origin/main)" = '33b2e0122d054db42e34c0951d61bacab2bec43b'
          git checkout -B claude/imzml-spatial-sections-ver71-0 origin/main
          test ! -e .pr-bootstrap-spatial
          test ! -e .github/workflows/imzml-spatial-prepare-temporary.yml
          git apply --check /tmp/imzml-spatial.patch
          git apply /tmp/imzml-spatial.patch
          git diff --check
          test "$(git diff --name-only origin/main | sed '/^$/d' | wc -l)" -eq 30
          test "$(grep -oP 'APP_VERSION = "\K[^"]+' App/app/version.py)" = '71.0'
      - name: Python依存とpytestを導入
        run: python3 -m pip install --disable-pip-version-check --quiet -r App/requirements.txt pytest
      - name: 構文・UI資産・テンプレートを検査
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          from jinja2 import Environment

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines()
          for name in changed:
              path = Path(name)
              if name.endswith('.py'):
                  ast.parse(path.read_text(encoding='utf-8'), filename=name)
              if name.endswith('.html'):
                  Environment().parse(path.read_text(encoding='utf-8'))
          print(f'validated changed files: {len(changed)}')
          PY
          node --check App/app/assets/imzml_spatial_float.js
      - name: 座標切片・変換・section契約・既存回帰テスト
        env:
          PYTHONPATH: App
        run: |
          python3 -m pytest -q \
            App/tests/test_imzml_spatial_layout.py \
            App/tests/test_imzml_spatial_manifest.py \
            App/tests/test_imzml_spatial_ui.py \
            App/tests/test_imzml_io.py \
            App/tests/test_imzml_autoimport_core.py \
            App/tests/test_imzml_autoimport_validation.py \
            App/tests/test_imzml_autoimport_pipeline.py \
            App/tests/test_imzml_autoimport_real_io.py \
            App/tests/test_section_metadata_workflow.py \
            App/tests/test_section_execution_policy.py \
            App/tests/test_section_analysis_contract.py \
            App/tests/test_section_group_metadata.py \
            App/tests/test_section_group_buttons.py \
            App/tests/test_settings_runtime_callbacks.py \
            App/tests/test_data_manager.py \
            App/tests/test_scils_converter.py \
            App/tests/test_data_export.py \
            App/tests/test_export_column_selection.py \
            App/tests/test_pptx_per_method_names.py \
            App/tests/test_version_consistency.py
      - name: R変更ファイルを構文検査
        shell: bash
        run: |
          set -euo pipefail
          if command -v Rscript >/dev/null 2>&1; then
            Rscript -e 'for (f in commandArgs(TRUE)) parse(file=f)' \
              App/Script/helpers/analysis_contract.R \
              App/Script/helpers/extract_seurat_data.R \
              App/Script/TIMS/260623_DBSCAN_With_cluster_ver6_no-png_slim.R \
              App/Script/TIMS/260623_DBSCAN_ver18_Cluster_Filter_ReUMAP.R \
              App/Script/DESI/260623_DESI-UMAP_Template_v16.R \
              App/Script/DESI/DESI_RDS_ClusterFilter_ver3.R
          else
            echo 'Rscriptなし: pytest内のR契約試験はskip条件を報告する'
          fi
      - name: 検証済み差分を専用PRブランチへ登録
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ryoma67744'
          git config user.email '76196606+Ryoma67744@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only | sed '/^$/d' | wc -l)" -eq 30
          git commit -m 'imzML座標から複数切片を認識して配置floatを追加 [ver71.0]'
          git push origin HEAD:refs/heads/claude/imzml-spatial-sections-ver71-0
          git rev-parse HEAD
