# ★ ver74.0: imzML/Arrow/R依存がないため全skipでも成功する状態を防ぐ。
name: analysis-contract
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analysis-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c .github/ci/requirements-constraints.txt -r App/requirements.txt pytest openapi-spec-validator==0.9.0
      - name: 必須依存と実I/O契約
        working-directory: App
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -c 'import pyarrow, pyimzml, openapi_spec_validator'
          python -m pytest tests/test_imzml_io.py tests/test_imzml_processed_sparse.py tests/test_imzml_contract_repairs_v74.py tests/test_imzml_standard_parquet_v74.py tests/test_imzml_registration_v74.py tests/test_registration_lifecycle_v74.py tests/test_imzml_editor_callback_transitions_v74.py tests/test_section_completeness_v74.py tests/test_section_registration_guidance_v741.py tests/test_imzml_registration_guidance_v741.py tests/test_section_metadata_workflow.py tests/test_audit_io_guards.py tests/test_volume_backup.py tests/test_callback_authorization_v74.py tests/test_public_url_is_consistent.py tests/test_render_payload.py tests/test_tims_export_precision_v74.py tests/test_diag_umap_cluster_export_v74.py tests/test_services_audit_regressions.py tests/test_numeric_input_bounds.py tests/test_packaging.py tests/test_version_consistency.py tests/test_export_selection.py tests/test_export_selection_callbacks.py tests/test_export_selection_io.py tests/test_export_selection_jobs.py tests/test_imzml_asset_diagnostics_v752.py tests/test_restore_imzml_assets.py tests/test_result_descriptor.py tests/test_reanalysis_method_detection.py tests/test_deg_method_scope.py tests/test_result_snapshot_export.py tests/test_stage_signatures_v2.py tests/test_section_execution_policy.py tests/test_legacy_result_import.py tests/test_project_result_refs.py tests/test_downstream_new_ui.py tests/test_downstream_overwrite_is_confirmed.py tests/test_callback_targets_exist_in_layout.py -q --junitxml=contract.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("contract.xml"); assert len(r.findall(".//testcase"))>0; assert not r.findall(".//skipped"), "required contract tests must not skip"'
      - name: 再解析入力とHTTP診断の回帰
        working-directory: App
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/test_reanalysis_sample_selector_lifecycle.py tests/test_http_request_diagnostics.py tests/test_browser_diagnostics.py tests/test_api_failures_are_legible.py tests/test_reanalysis_exact_source.py tests/test_unchecking_everything_stops_the_run.py -q
      - name: imzML対応ソート・高速化・一括登録の契約
        working-directory: App
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/test_imzml_spectrum_order.py tests/test_imzml_dictionary.py tests/test_imzml_block_policy.py tests/test_imzml_processed_performance.py tests/test_imzml_grouping_bounds.py tests/test_imzml_common_memory.py tests/test_imzml_registration_block_v78.py tests/test_imzml_progress_v78.py tests/test_imzml_registration_queue.py tests/test_imzml_registration_worker.py tests/test_imzml_registration_ui.py tests/test_imzml_browse_files.py tests/test_imzml_autoimport_core.py tests/test_imzml_autoimport_validation.py tests/test_imzml_autoimport_real_io.py -q --junitxml=imzml78.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("imzml78.xml"); assert len(r.findall(".//testcase"))>0; assert not r.findall(".//skipped"), "imzML v78 tests must not skip"'
      - name: WinSCPパス・共有権限・移行コピーの契約
        working-directory: App
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/test_public_paths.py tests/test_winscp_browser.py tests/test_imzml_shared_permissions.py tests/test_verify_imzml_asset_copy.py -q --junitxml=winscp80.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("winscp80.xml"); assert len(r.findall(".//testcase"))>0; assert not r.findall(".//skipped"), "WinSCP Linux contracts must not skip"'
  # ★ ver75.1: 登録に加え、出力対象の選択からダウンロードまで実ブラウザで必須検証する。
  registration-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c .github/ci/requirements-constraints.txt -r App/requirements.txt pytest playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: 切片登録と選択データのダウンロード
        working-directory: App
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          E2E_STRICT: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/e2e/test_section_registration_guidance.py tests/e2e/test_export_selection.py tests/e2e/test_result_scope.py tests/e2e/test_reanalysis_registration_lifecycle.py -q --junitxml=registration-browser.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("registration-browser.xml"); assert len(r.findall(".//testcase"))>0; assert not r.findall(".//skipped"), "registration browser test must not skip"'
      - name: imzML一括登録から実worker変換・解析設定への引渡し
        working-directory: App
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          E2E_STRICT: '1'
          # 4画素×2のfixtureに限り、7GB runner上の10GB受付条件を代替する。
          # 実workerのメモリ検査・変換・検証は実行する。通常ローカル試験では未指定。
          E2E_ADMISSION_MEMORY_SHIM: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/e2e/test_imzml_batch_registration.py -q --junitxml=imzml78-browser.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("imzml78-browser.xml"); assert len(r.findall(".//testcase"))>0; assert not r.findall(".//skipped"), "imzML v78 browser test must not skip"'
      - name: WinSCPパス表示と固定入力の互換性
        working-directory: App
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          E2E_STRICT: '1'
          E2E_WINSCP_PATHS: '1'
          E2E_ADMISSION_MEMORY_SHIM: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/e2e/test_winscp_paths.py -q --junitxml=winscp80-browser.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("winscp80-browser.xml"); assert len(r.findall(".//testcase"))>0; assert not r.findall(".//skipped"), "WinSCP browser tests must not skip"'
      - name: Caddy検証用バイナリを取得
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caddy"
          cd "$RUNNER_TEMP/caddy"
          base=https://github.com/caddyserver/caddy/releases/download/v2.11.7
          curl --fail --location "$base/caddy_2.11.7_linux_amd64.tar.gz" -o caddy.tar.gz
          curl --fail --location "$base/caddy_2.11.7_checksums.txt" -o checksums.txt
          expected=$(awk '$2 == "caddy_2.11.7_linux_amd64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  caddy.tar.gz\n' "$expected" | sha512sum --check -
          tar -xzf caddy.tar.gz caddy
      - name: Caddy経由の登録操作と通信失敗
        working-directory: App
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          E2E_STRICT: '1'
          CADDY_STRICT: '1'
          CADDY_BINARY: ${{ runner.temp }}/caddy/caddy
          E2E_CADDY_BINARY: ${{ runner.temp }}/caddy/caddy
        run: |
          set -euo pipefail
          python -m pytest tests/test_caddy_request_diagnostics.py tests/e2e/test_reanalysis_registration_lifecycle.py -q --junitxml=proxy-browser.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("proxy-browser.xml"); assert len(r.findall(".//testcase"))>0; assert not r.findall(".//skipped"), "proxy tests must not skip"'
  r-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/ci/r-contract.yml
          cache-environment: true
      - name: Python試験依存
        shell: micromamba-shell {0}
        run: python -m pip install -c .github/ci/requirements-constraints.txt -r App/requirements.txt pytest
      - name: R構文・保存・DESI・Seurat・Arrow契約
        shell: micromamba-shell {0}
        working-directory: App
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          Rscript -e 'stopifnot(all(vapply(c("Seurat","arrow","jsonlite","digest","data.table"), requireNamespace, logical(1), quietly=TRUE))); invisible(lapply(list.files("Script", pattern="[.]R$", recursive=TRUE, full.names=TRUE), parse))'
          python -m pytest tests/test_r_safety_v74.py tests/test_tims_r_v74_contract.py tests/test_job_registry.py tests/test_imzml_autoimport_pipeline.py tests/test_stage_contract_r_v2.py tests/test_desi_section_execution_contract.py tests/test_result_facts_r.py tests/test_parquet_column_roles_r.py -q --junitxml=r-contract.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("r-contract.xml"); assert len(r.findall(".//testcase"))>0; assert not r.findall(".//skipped"), "R/Seurat contracts must not skip"'
