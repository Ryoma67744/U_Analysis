name: imzml-spatial-float-editor-temporary
on:
  push:
    branches: [claude/imzml-spatial-float-editor-ver71-1]
permissions:
  contents: write
concurrency:
  group: imzml-spatial-float-editor-ver71-1
  cancel-in-progress: false
jobs:
  prepare:
    if: startsWith(github.event.head_commit.message, '[apply-imzml-float-editor]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: ver71.1修正を適用
        run: python3 .pr-bootstrap-float-editor/apply.py
      - name: Python依存とpytestを導入
        run: python3 -m pip install --disable-pip-version-check --quiet -r App/requirements.txt pytest
      - name: 構文・テンプレート・JavaScript検査
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          from jinja2 import Environment
          for path in [
              Path('App/app/layouts/imzml_spatial_float.py'),
              Path('App/app/callbacks/imzml_spatial_callbacks.py'),
              Path('App/app/callbacks/section_callbacks.py'),
              Path('App/app/layouts/settings_tab.py'),
              Path('App/app/services/section_metadata.py'),
              Path('App/tests/test_imzml_spatial_static_contract.py'),
              Path('App/tests/test_imzml_spatial_manifest.py'),
          ]:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          Environment().parse(Path('App/app/templates/help/imzml_autoimport.html').read_text(encoding='utf-8'))
          print('Python/Jinja parse OK')
          PY
          node --check App/app/assets/imzml_spatial_float.js
          git diff --check
      - name: 座標切片・画面callback・既存回帰テスト
        env:
          PYTHONPATH: App
          FLASK_SECRET_KEY: test-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          MASTER_PASSWORD: runtime-test-password
          INITIAL_PASSWORD_B: runtime-share
        run: |
          python3 -m pytest -q \
            App/tests/test_imzml_spatial_layout.py \
            App/tests/test_imzml_spatial_manifest.py \
            App/tests/test_imzml_spatial_static_contract.py \
            App/tests/test_imzml_io.py \
            App/tests/test_imzml_autoimport_core.py \
            App/tests/test_imzml_autoimport_validation.py \
            App/tests/test_imzml_autoimport_pipeline.py \
            App/tests/test_imzml_autoimport_real_io.py \
            App/tests/test_section_metadata_workflow.py \
            App/tests/test_section_execution_policy.py \
            App/tests/test_section_analysis_contract.py \
            App/tests/test_section_group_metadata.py \
            App/tests/test_section_group_buttons.py \
            App/tests/test_settings_runtime_callbacks.py \
            App/tests/test_export_options.py \
            App/tests/test_data_manager.py \
            App/tests/test_scils_converter.py \
            App/tests/test_data_export.py \
            App/tests/test_export_column_selection.py \
            App/tests/test_pptx_per_method_names.py \
            App/tests/test_version_consistency.py
      - name: 検証済み修正を同じPR用ブランチへ登録
        run: |
          set -euo pipefail
          test "$(grep -oP 'APP_VERSION = "\K[^"]+' App/app/version.py)" = '71.1'
          rm -rf .pr-bootstrap-float-editor .github/workflows/imzml-spatial-float-editor-temporary.yml
          git config user.name 'Ryoma67744'
          git config user.email '76196606+Ryoma67744@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'imzML切片floatを大型化し切片名・個体ID・群編集を統合 [ver71.1]'
          git push origin HEAD:refs/heads/claude/imzml-spatial-float-editor-ver71-1
