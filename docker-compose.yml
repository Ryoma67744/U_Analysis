# =============================================================================
# MSI Analysis Application - Docker Compose
# 開発・テスト用構成
# =============================================================================

services:
  msi-app:
    build: .
    container_name: msi-analysis-app
    # SFTPユーザー(共有グループ msi-lab)とデータを共有するため、アプリを共有グループに
    # 参加させる。/srv/msi を group=msi-lab + setgid(2775) にしておくと、アプリ生成物も
    # グループ書込可になり、SFTPユーザーとアプリの双方が読み書きできる。
    group_add:
      - "${MSI_SHARED_GID:-1001}"
    ports:
      - "${APP_PORT:-3838}:3838"
    environment:
      - R_HOME=/usr/lib/R
      - APP_HOST=0.0.0.0
      - APP_PORT=3838
      # 認証 (Tier A: 解析者用 / Tier B: 共有 URL 閲覧用 / Master: 変更権限)
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - MASTER_PASSWORD=${MASTER_PASSWORD:-}
      - INITIAL_PASSWORD_A=${INITIAL_PASSWORD_A:-}
      - INITIAL_PASSWORD_B=${INITIAL_PASSWORD_B:-}
      - SESSION_COOKIE_MAX_AGE_SEC=${SESSION_COOKIE_MAX_AGE_SEC:-86400}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - SHARE_BASE_URL=${SHARE_BASE_URL:-}
      # ver41.0: ChatGPT 連携 API (/api/gpt/*) の合言葉。未設定なら窓口は 503 で閉じる。
      - GPT_API_KEY=${GPT_API_KEY:-}
      # 生データ・出力外部パス (.env で上書き可。未設定時は named volume にフォールバック)
      - DESI_DATA_DIR=/app/Data/DESI/Data
      - TIMS_DATA_DIR=/app/Data/TIMS/Data
      - OUTPUT_DATA_DIR=/app/Data/Other/output
      # ver4.4: Seurat 抽出キャッシュを永続ボリュームに置き、再デプロイで消えない
      # ようにする (共有を開いたときのコールド R 抽出を防ぐ)。専用ディレクトリ必須
      # (LRU 退避が配下サブディレクトリを削除するため diskcache と同居させない)。
      - SEURAT_CACHE_DIR=/app/Data/Other/seurat_cache
      - SEURAT_CACHE_MAX_ENTRIES=30
      # 解析(R)の行列計算スレッド数。analysis_runner.py は未設定時 4 を既定にするため
      # ここで明示すると上書きできる。cpus:'6' に対し 5 = UI 応答に 1 コア残す折衷。
      # 最速にしたいなら 6、UI 応答を優先するなら 4 に。
      - OPENBLAS_NUM_THREADS=5
      - OMP_NUM_THREADS=5
      - MKL_NUM_THREADS=5
      # 解析(R)のメモリ/実行時間ガード。.env に書いても environment に列挙しないと
      # コンテナへ渡らない（compose の .env は ${VAR} 置換専用）ため明示的に中継する。
      # R_MAX_VSIZE_GB>0 で cgroup OOM kill(無言終了)を R の明示エラーに変えられる。
      - R_MAX_VSIZE_GB=${R_MAX_VSIZE_GB:-0}
      - R_ANALYSIS_TIMEOUT_SEC=${R_ANALYSIS_TIMEOUT_SEC:-0}
      # Step3 RPCA(IntegrateLayers) の実行可否。0 でスキップ（低メモリ環境の逃げ道）。
      - RUN_RPCA=${RUN_RPCA:-1}
    volumes:
      # 永続化データ (Data/Other/ 配下のアプリ内部データ)
      - msi-sessions:/app/Data/Other/sessions
      - msi-projects:/app/Data/Other/projects
      - msi-presets:/app/Data/Other/presets
      - msi-shares:/app/Data/Other/shares
      - msi-cache:/app/Data/Other/cache
      # ver4.4: Seurat 抽出キャッシュ専用 (diskcache とは別ボリューム)
      - msi-seurat-cache:/app/Data/Other/seurat_cache
      # 認証設定 (auth.json: bcrypt ハッシュ + password_version)
      - msi-common:/app/Data/Other/common
      # 解析データ（ユーザーがアップロード）
      # .env で DESI_DATA_HOST / TIMS_DATA_HOST を指定すればホストの固定パスをマウント
      - ${DESI_DATA_HOST:-msi-desi-data}:/app/Data/DESI/Data
      - ${TIMS_DATA_HOST:-msi-tims-data}:/app/Data/TIMS/Data
      # 解析出力（.env で OUTPUT_DATA_HOST を指定すればホストの固定パスをマウント）
      - ${OUTPUT_DATA_HOST:-msi-output}:/app/Data/Other/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3838/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 12g
    # mem_limit(物理RAM)を超えた分はホストスワップへ退避し OOM kill を回避する。
    # 16GBホスト＋32GBスワップ運用で、PCA/UMAP の一時的なメモリスパイクを吸収する。
    # （swap=40-12=28GB まで利用可。ホストに 32GB swap がある前提）
    memswap_limit: 40g
    cpus: '6'
    # ヘッドレス Chromium (kaleido) は共有メモリを使う。既定 64MB では PPTX 画像描画が
    # 不安定になり得るため拡張する（--disable-dev-shm-usage 併用でも安全側）。
    shm_size: '1gb'

volumes:
  msi-sessions:
  msi-projects:
  msi-presets:
  msi-shares:
  msi-cache:
  msi-seurat-cache:
  msi-common:
  msi-desi-data:
  msi-tims-data:
  msi-output:
