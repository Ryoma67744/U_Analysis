# =============================================================================
# MSI Analysis Application - Docker Compose
# 開発・テスト用構成
# =============================================================================

services:
  msi-app:
    build: .
    container_name: msi-analysis-app
    ports:
      - "${APP_PORT:-3838}:3838"
    environment:
      - R_HOME=/usr/lib/R
      - APP_HOST=0.0.0.0
      - APP_PORT=3838
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SHARE_BASE_URL=${SHARE_BASE_URL:-}
      # 生データ外部パス (.env で上書き可。未設定時は named volume にフォールバック)
      - DESI_DATA_DIR=/app/Data/DESI/Data
      - TIMS_DATA_DIR=/app/Data/TIMS/Data
    volumes:
      # 永続化データ (Data/Other/ 配下のアプリ内部データ)
      - msi-sessions:/app/Data/Other/sessions
      - msi-projects:/app/Data/Other/projects
      - msi-presets:/app/Data/Other/presets
      - msi-shares:/app/Data/Other/shares
      - msi-cache:/app/Data/Other/cache
      # 解析データ（ユーザーがアップロード）
      # .env で DESI_DATA_HOST / TIMS_DATA_HOST を指定すればホストの固定パスをマウント
      - ${DESI_DATA_HOST:-msi-desi-data}:/app/Data/DESI/Data
      - ${TIMS_DATA_HOST:-msi-tims-data}:/app/Data/TIMS/Data
      # 解析出力
      - msi-output:/app/Data/Other/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3838/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 12g
    cpus: '6'

volumes:
  msi-sessions:
  msi-projects:
  msi-presets:
  msi-shares:
  msi-cache:
  msi-desi-data:
  msi-tims-data:
  msi-output:
