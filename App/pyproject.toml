[build-system]
requires = ["setuptools>=68.0"]
# ★ ver51.8: 以前は "setuptools.backends._legacy:_Backend" だったが、
#   `setuptools.backends` というモジュールは **宣言している setuptools 68 に存在しない**
#   (実機で ModuleNotFoundError を確認)。そのため `pip install .` / wheel ビルドが
#   一切開始できなかった。標準のバックエンドに直す。
#   ※ 本番 Docker は requirements.txt を使うのでランタイムには影響していない。
build-backend = "setuptools.build_meta"

[project]
name = "msi-analysis-app"
version = "2.1.0"
description = "Mass Spectrometry Imaging UMAP Analysis Application"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "dash[diskcache]>=2.14,<3.0",
    "flask-compress>=1.14",  # Dash コールバック応答の gzip 圧縮
    "waitress>=3.0",  # 本番用 WSGI サーバ（1 ワーカー + マルチスレッド）
    "dash-bootstrap-components>=1.5,<2.0",
    "plotly>=5.18,<6.0",
    "pandas>=2.1,<3.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "polars-lts-cpu>=0.20",  # 古い CPU でのクラッシュ回避（import polars 互換）
    "psutil>=5.9",
    "python-pptx>=0.6.21",
    # requirements.txt と同じピン。kaleido 1.x は plotly 6.1+ を要求するが、
    # 本アプリは plotly 5.x に固定している（ver46.3 で 6 系は実測で逆効果と結論）。
    # 上限なしにすると環境によって 1.x が入り、PNG 出力だけが壊れる。
    "kaleido==0.2.1",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    # ★ ver51.8: requirements.txt にあって pyproject に無かった 2 つ。
    #   wheel 経由で入れると認証 (auth_service) と排他制御 (file_locks) が
    #   import 時に落ちる。依存表は 1 つに揃える。
    "bcrypt>=4.0",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
# E2E (Playwright) テスト用。インストール後に `playwright install chromium` が必要
# （本番 Docker/CI には Chromium 同梱を想定）。
e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
]

[project.scripts]
msi-app = "run_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: ブラウザ E2E テスト (Playwright)。",
    "requires_data: 実データ (R/Seurat + 結果フォルダ RDS) が必要なテスト。",
]

[tool.setuptools]
packages = ["app", "app.callbacks", "app.layouts", "app.services", "app.utils"]
# ★ ver51.8: `[project.scripts] msi-app = "run_app:main"` が指す run_app は
#   パッケージではなく単体モジュールなので、明示しないと wheel に入らず
#   `msi-app` 実行時に ModuleNotFoundError になっていた。
py-modules = ["run_app"]

[tool.setuptools.package-data]
# ★ ver51.8: assets (clientside JS/CSS) と templates (ログイン画面) は .py ではないので
#   宣言しないと wheel に含まれず、インストール後にフロントエンドが壊れる。
app = ["assets/*", "templates/*"]
