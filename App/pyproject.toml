[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "msi-analysis-app"
version = "2.1.0"
description = "Mass Spectrometry Imaging UMAP Analysis Application"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "dash[diskcache]>=2.14,<3.0",
    "dash-bootstrap-components>=1.5,<2.0",
    "plotly>=5.18,<6.0",
    "pandas>=2.1,<3.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "polars-lts-cpu>=0.20",  # 古い CPU でのクラッシュ回避（import polars 互換）
    "psutil>=5.9",
    "python-pptx>=0.6.21",
    "kaleido>=0.2.1",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
msi-app = "run_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.callbacks", "app.layouts", "app.services", "app.utils"]
